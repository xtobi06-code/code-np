<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/scene.css">
<style>[hidden]{display:none!important}html,body{margin:0;width:540px;height:540px;overflow:hidden}#a{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 20% 0%,#5fb0ff 0%,transparent 60%),linear-gradient(160deg,#1f78ff 0%,#4b4df0 55%,#7a2ff0 100%)}
#a::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 45%)}
#a .k{position:relative;z-index:1;width:300px;height:300px;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 10px 18px rgba(20,10,80,.45))}
.szene .sz-schleier{background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.15))}</style></head><body>
<div id="s"></div><div id="a" hidden><div class="k" id="k"></div></div>
<script type="module">
import { erstelleSzene } from '../shared/scene.js';
import { icon } from '../shared/icons.js';
const art = new URLSearchParams(location.search).get('art');
if (art === 'alltag') { document.getElementById('a').hidden = false; document.getElementById('k').innerHTML = icon('liste', 300, 1.9); }
else { const sz = erstelleSzene(document.getElementById('s')); sz.aktualisiere(new Date('2026-11-03T16:45:00+01:00'), 0); }
</script></body></html>
