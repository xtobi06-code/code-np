<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zuhause">
<meta name="theme-color" content="#02040b">
<title>Zuhause</title>
<link rel="apple-touch-icon" href="../icons/zuhause-180.png">
<link rel="icon" href="../icons/zuhause-512.png">
<link rel="stylesheet" href="../shared/scene.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="szene"></div>
<div class="nacht-schleier" id="schleier"></div>

<div class="app" id="app">
  <div class="seiten" id="seiten">

    <!-- 1 Übersicht -->
    <section class="seite uebersicht">
      <div class="spalte links">
        <div class="sperr">
          <div class="sperr-datum" id="datum">…</div>
          <div class="sperr-uhr" id="uhr">--:--</div>
          <div class="sperr-wetter" id="wetter-kurz"></div>
          <div class="kleidung glas klein" id="kleidung" hidden></div>
        </div>
        <div class="glas widget stapel" id="stapel">
          <div class="stapel-karten" id="stapel-karten"></div>
          <div class="stapel-punkte" id="stapel-punkte"></div>
        </div>
      </div>
      <div class="glas widget liste-widget">
        <header class="w-kopf"><span class="w-titel"><span class="w-ic" id="ic-studium"></span>Studium</span><span class="w-zahl" id="n-studium"></span></header>
        <div class="liste" id="studium"></div>
      </div>
      <div class="spalte rechts">
        <div class="glas widget liste-widget leben">
          <header class="w-kopf"><span class="w-titel"><span class="w-ic" id="ic-leben"></span>Leben</span><span class="w-zahl" id="n-leben"></span></header>
          <div class="liste" id="leben"></div>
        </div>
        <div class="glas widget licht-widget">
          <header class="w-kopf"><span class="w-titel"><span class="w-ic" id="ic-licht"></span>Licht</span><button class="pille" data-seite="1">Alle <span id="n-licht"></span></button></header>
          <div class="kacheln" id="licht-fav"></div>
        </div>
      </div>
    </section>

    <!-- 2 Licht -->
    <section class="seite lichtseite">
      <header class="seiten-kopf"><h1>Licht</h1><span class="unter" id="licht-zuletzt"></span></header>
      <div class="kacheln gross" id="licht-alle"></div>
    </section>

    <!-- 3 Uhr -->
    <section class="seite ruhe" id="ruhe">
      <div class="ruhe-datum" id="r-datum"></div>
      <div class="ruhe-uhr" id="r-uhr">--:--</div>
      <div class="ruhe-info" id="r-info"></div>
    </section>
  </div>
</div>

<nav class="punkte glas" id="punkte">
  <button data-seite="0" aria-label="Übersicht"></button><button data-seite="1" aria-label="Licht"></button><button data-seite="2" aria-label="Uhr"></button>
</nav>
<a class="ecke rechts glas" href="../einstellungen.html" id="einst" aria-label="Einstellungen"></a>
<div class="ecke links status" id="status" hidden></div>
<div class="hinweis" id="hinweis"><div class="glas widget"><b>Noch nicht verbunden</b><p>Trage das Token in den Einstellungen ein.</p><a class="pille" href="../einstellungen.html">Einstellungen öffnen</a></div></div>
<script type="module" src="panel.js"></script>
</body>
</html>
