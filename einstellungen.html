<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Einstellungen</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  main { padding: calc(env(safe-area-inset-top) + 76px) 16px calc(40px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  .leiste { position: fixed; inset: 0 0 auto 0; height: 0; z-index: 30; }
  .zurueck { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 20px); left: 16px; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: var(--text); background: rgba(34, 38, 56, .96); -webkit-  border: .5px solid var(--glas-rand); box-shadow: var(--glas-schatten), inset 0 1px 0 rgba(255,255,255,.14); }
  .sichern-knopf { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 20px); right: 16px; height: 44px; padding: 0 20px; border-radius: 22px; border: .5px solid var(--glas-rand); background: rgba(34, 38, 56, .96);  -webkit- color: var(--t3); font-weight: 600; font-size: 16px; transition: background .2s, color .2s; }
  .sichern-knopf.an { background: var(--accent); color: #fff; border-color: transparent; }
  .griff { flex: none; display: grid; place-items: center; width: 34px; height: 34px; margin: -6px -8px -6px 0; color: var(--t3); touch-action: none; cursor: grab; }
  [data-reihe].zieht { position: relative; z-index: 5; background: var(--karte2); box-shadow: 0 8px 24px rgba(0,0,0,.5); border-radius: 12px; }
  .frage { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.5); display: grid; place-items: center; padding: 24px; }
  .frage-box { width: 100%; max-width: 320px; background: var(--karte); border-radius: 24px; padding: 22px; display: grid; gap: 10px; text-align: center; }
  .wisch { position: relative; overflow: hidden; }
  .wisch + .wisch::before, .wisch + .zeile::before { content: ""; position: absolute; top: 0; right: 0; left: 18px; border-top: .5px solid var(--linie); z-index: 2; }
  .wisch .vorn { position: relative; z-index: 1; background: var(--karte); transition: transform .28s cubic-bezier(.25,.9,.3,1); touch-action: pan-y; }
  .wisch .loesch { position: absolute; top: 0; right: 0; bottom: 0; width: 0; overflow: hidden; white-space: nowrap; border: 0; padding: 0; background: var(--bad); color: #fff; font: inherit; font-size: 16px; font-weight: 600; display: grid; place-items: center; transition: width .28s cubic-bezier(.25,.9,.3,1); }
  .wisch.zieht .vorn, .wisch.zieht .loesch { transition: none; }
  .frage-box { position: relative; }
  .frage-zu { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: rgba(255,255,255,.1); color: var(--t2); display: grid; place-items: center; padding: 0; }
  .knopf.leicht { background: rgba(255,255,255,.05); border: .5px solid rgba(255,255,255,.18); color: var(--bad); }
  .frage-box p { margin: 0 0 6px; color: var(--t2); font-size: 15px; }
  .zurueck .ic { transform: rotate(180deg); }
  h1 { font-size: 34px; font-weight: 700; margin: 0 0 18px; }
  .zeile label, .zeile .lbl { flex: 1; min-width: 0; }
  .zeile label.schalter { flex: none; }
  .zeile input:not([type=checkbox]), .zeile select { border: 0; background: transparent; text-align: right; outline: none; min-width: 0; font-size: 17px; color: var(--t2); }
  .zeile input:focus { color: var(--text); }
  #c-owner, #c-repo, #c-token { flex: 1; }
  .zeile .lbl { white-space: nowrap; }
  .zeile input.links { text-align: left; color: var(--text); }
  .zeile input.zahl { width: 90px; }
  .zeile input.datum { width: 140px; }
  .x { background: none; border: 0; color: var(--bad); padding: 4px; display: grid; place-items: center; }
  .zeile .x { color: var(--bad); }
  .knopfzeile { display: flex; gap: 10px; margin: -12px 0 26px; }
  .knopf { flex: 1; border: 0; border-radius: 999px; padding: 13px; background: var(--accent); color: #fff; font-weight: 600; }
  .knopf.zwei { background: var(--karte); color: var(--accent); }
  .meldung { font-size: 14px; margin: -18px 16px 24px; min-height: 18px; color: var(--t2); }
  .meldung.ok { color: var(--ok); } .meldung.bad { color: var(--bad); }
  .fuss { font-size: 13px; color: var(--t2); margin: -14px 16px 24px; line-height: 1.4; }
  .schalter { position: relative; width: 51px; height: 31px; flex: none; }
  .schalter input { opacity: 0; width: 0; height: 0; position: absolute; }
  .schalter span { position: absolute; inset: 0; background: var(--seg); border-radius: 999px; transition: background .2s; }
  .schalter span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); transition: transform .2s; }
  .schalter input:checked + span { background: var(--ok); }
  .schalter input:checked + span::after { transform: translateX(20px); }
  .regel { border-bottom: .5px solid var(--linie); }
  .regel:last-child { border-bottom: 0; }
  .regel .kopf { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  .regel .kopf .name { flex: 1; font-weight: 500; }
  .regel .kopf .name small { color: var(--t2); font-weight: 400; margin-left: 6px; }
  .regel .kopf .dot { width: 10px; height: 10px; border-radius: 50%; }
  .regel .koerper { padding: 0 16px 14px; display: grid; gap: 10px; }
  .regel .reihe { display: flex; align-items: center; gap: 8px; font-size: 15px; flex-wrap: wrap; }
  .regel .reihe > span:first-child { color: var(--t2); width: 92px; flex: none; }
  .regel input, .regel select { background: var(--karte2); border: 0; border-radius: 8px; padding: 6px 8px; font-size: 15px; min-width: 0; }
  .regel input.kurz { width: 70px; }
  .tage { display: flex; gap: 4px; }
  .tage button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--karte2); font-size: 13px; font-weight: 600; }
  .tage button.an { background: var(--accent); color: #fff; }
  .zeiten { display: flex; gap: 6px; flex-wrap: wrap; }
  .zeiten label { display: flex; gap: 4px; align-items: center; font-size: 14px; color: var(--t2); }
  .symbole { display: flex; gap: 6px; flex-wrap: wrap; }
  .symbole button { width: 34px; height: 34px; border-radius: 9px; border: 0; background: var(--karte2); display: grid; place-items: center; }
  .symbole button.an { background: var(--accent); color: #fff; }
  .farbe { width: 30px; height: 30px; border: 0; padding: 0; border-radius: 50%; overflow: hidden; background: none; }
  details summary { list-style: none; cursor: pointer; }
  details summary::-webkit-details-marker { display: none; }
  .anleitung { padding: 4px 16px 14px; font-size: 15px; line-height: 1.45; }
  .anleitung ol { padding-left: 20px; margin: 8px 0; }
  .anleitung li { margin-bottom: 6px; }
  .anleitung code { background: var(--karte2); border-radius: 5px; padding: 1px 5px; font-size: 13px; word-break: break-all; }
  .fotos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 14px; }
  .foto { position: relative; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; background: var(--karte2); }
  .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .foto button { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; display: grid; place-items: center; padding: 0; }
  .tint { position: fixed; inset: 0 0 auto 0; height: 300px; z-index: -1; pointer-events: none; background: radial-gradient(120% 100% at 15% 0%, rgba(142,142,147,.18), transparent 70%); }
  pre { background: var(--karte2); border-radius: 8px; padding: 10px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<div class="tint"></div>
<main>
  <div class="leiste"><a class="zurueck" href="./" id="zurueck"></a><button class="sichern-knopf" id="sichern" hidden>Sichern</button></div>
  <h1>Einstellungen</h1>
  <div id="inhalt"></div>
</main>
<script type="module" src="einstellungen.js"></script>
</body>
</html>
