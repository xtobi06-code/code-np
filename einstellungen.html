<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einstellungen</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  body { padding: 16px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 26px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 14px 0 4px; }
  input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  button { margin-top: 14px; width: 100%; padding: 13px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 600; }
  button.alt { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  #meldung { margin-top: 12px; min-height: 1.4em; }
  p.hinweis { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<p><a href="./">← Zurück</a></p>
<h1>Einstellungen</h1>
<div class="card">
  <h2>Verbindung zum Daten-Repo</h2>
  <label for="owner">GitHub-Konto</label><input id="owner" autocapitalize="none" autocorrect="off">
  <label for="repo">Daten-Repo</label><input id="repo" autocapitalize="none" autocorrect="off">
  <label for="token">Token (Fine-grained, nur für das Daten-Repo, Contents: Lesen und Schreiben)</label>
  <input id="token" type="password" autocapitalize="none" autocorrect="off" placeholder="github_pat_…">
  <button id="speichern">Speichern und testen</button>
  <div id="meldung"></div>
  <p class="hinweis">Das Token bleibt nur in diesem Browser auf diesem Gerät gespeichert. Läuft es ab (spätestens nach einem Jahr), erscheint hier und auf den Seiten „Nicht verbunden“.</p>
</div>
<script type="module">
  import { config, saveConfig, lesen } from './shared/github.js';
  const $ = (id) => document.getElementById(id);
  const c = config();
  $('owner').value = c.owner; $('repo').value = c.repo; $('token').value = c.token;
  $('speichern').addEventListener('click', async () => {
    saveConfig({ owner: $('owner').value.trim(), repo: $('repo').value.trim(), token: $('token').value.trim() });
    $('meldung').textContent = 'Teste …';
    try {
      const r = await lesen('einstellungen.json');
      $('meldung').innerHTML = r ? '<span class="punkt ok"></span>Verbunden, Daten gefunden.' : '<span class="punkt warn"></span>Verbunden, aber einstellungen.json fehlt noch.';
    } catch (e) {
      $('meldung').innerHTML = '<span class="punkt bad"></span>' + e.message;
    }
  });
</script>
</body>
</html>
