<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Alltag">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Alltag</title>
<link rel="stylesheet" href="shared/style.css">
<link rel="stylesheet" href="phone.css">
</head>
<body>
<div class="tint" id="tint"></div>
<div class="kante-oben"></div>
<div class="nav-knoepfe">
  <button class="rund glas" id="neu" aria-label="Hinzufügen"></button>
  <a class="rund glas" href="einstellungen.html" aria-label="Einstellungen" id="zahnrad"></a>
</div>

<main>
  <div class="kopf">
    <div class="info" id="datum">…</div>
    <h1 id="titel">To-dos</h1>
    <div class="wetterzeile" id="wetter"></div>
  </div>
  <div id="banner"></div>

  <section id="tab-todos" hidden>
    <div class="segment" data-seg="todoListe" style="--n:2"><button data-v="studium">Studium</button><button data-v="leben">Leben</button></div>
    <div class="gruppe eingabe-gruppe">
      <div class="zeile eingabe"><span class="kreis plus" id="plus-todo"></span><input class="feld" id="todo-input" placeholder="Neue Aufgabe" enterkeyhint="done" autocomplete="off"></div>
      <div class="zubehoer" id="todo-zubehoer" hidden>
        <div class="chips" id="todo-module"></div>
        <div class="chips" id="todo-faellig"></div>
      </div>
    </div>
    <div id="todo-liste"></div>
    <button class="textknopf" id="erledigt-umschalten"></button>
    <div id="erledigt-liste"></div>
  </section>

  <section id="tab-einkauf" hidden>
    <div class="gruppe eingabe-gruppe">
      <div class="zeile eingabe"><span class="kreis plus" id="plus-einkauf"></span><input class="feld" id="einkauf-input" placeholder="Artikel hinzufügen" enterkeyhint="done" autocomplete="off"></div>
    </div>
    <div class="vorschlaege" id="vorschlaege"></div>
    <div id="einkauf-liste"></div>
    <button class="textknopf" id="einkauf-aufraeumen" hidden>Erledigte entfernen</button>
  </section>

  <section id="tab-finanzen" hidden>
    <div class="segment" data-seg="finAnsicht" style="--n:2"><button data-v="uebersicht">Übersicht</button><button data-v="verlauf">Verlauf</button></div>
    <div id="fin-uebersicht">
      <div class="segment klein" data-seg="zeitraum" style="--n:3"><button data-v="monat">Monat</button><button data-v="3m">3 Monate</button><button data-v="12m">12 Monate</button></div>
      <div class="held" id="fin-held"></div>
      <div class="gruppe-titel"><span>Kategorien</span><span class="zahl" id="fin-hinweis"></span></div>
      <div class="gruppe" id="fin-kat"></div>
      <div id="fin-letzte"></div>
    </div>
    <div id="fin-verlauf" hidden>
      <div class="chips" id="verlauf-chips" style="margin-bottom:14px"></div>
      <div class="diagramm" id="verlauf-svg"></div>
      <div class="kennzahlen" id="verlauf-zahlen"></div>
    </div>
  </section>
</main>

<nav class="tabbar glas" id="tabbar">
  <span class="tab-pille"></span>
  <button data-tab="todos" id="tb-todos"></button>
  <button data-tab="einkauf" id="tb-einkauf"></button>
  <button data-tab="finanzen" id="tb-finanzen"></button>
</nav>

<div class="schleier" id="schleier"></div>

<!-- Ausgabe -->
<div class="blatt glas" id="blatt-kosten">
  <div class="griff"></div>
  <div class="kopfzeile"><button class="rund-k" data-zu aria-label="Abbrechen" id="kosten-zu"></button><b id="kosten-titel">Neue Ausgabe</b><button class="rund-k fertig" id="kosten-sichern" aria-label="Sichern"></button></div>
  <input class="betragfeld" id="betrag" inputmode="decimal" placeholder="0,00 €" autocomplete="off">
  <div class="katwahl" id="katwahl"></div>
  <div class="gruppe" style="margin-bottom:10px">
    <div class="zeile"><input class="feld" id="notiz" placeholder="Notiz (optional)" autocomplete="off"></div>
    <div class="zeile"><span class="haupt">Datum</span><input type="date" id="kosten-datum" class="datumfeld"></div>
  </div>
  <button class="loeschknopf" id="kosten-loeschen" hidden>Ausgabe löschen</button>
  <div class="fehler" id="kosten-fehler"></div>
</div>

<!-- Aufgabe bearbeiten -->
<div class="blatt glas" id="blatt-aufgabe">
  <div class="griff"></div>
  <div class="kopfzeile"><button class="rund-k" data-zu aria-label="Abbrechen" id="aufgabe-zu"></button><b>Aufgabe</b><button class="rund-k fertig" id="aufgabe-sichern" aria-label="Sichern"></button></div>
  <div class="gruppe" style="margin-bottom:14px"><div class="zeile"><input class="feld" id="aufgabe-titel" placeholder="Titel" autocomplete="off"></div></div>
  <div class="unterlabel">Liste</div>
  <div class="segment" id="aufgabe-liste" data-lokal style="--n:2"><button data-v="studium">Studium</button><button data-v="leben">Leben</button></div>
  <div id="aufgabe-modul-box"><div class="unterlabel">Modul</div><div class="chips" id="aufgabe-module" style="margin-bottom:16px"></div></div>
  <div class="unterlabel">Fällig</div>
  <div class="chips" id="aufgabe-faellig" style="margin-bottom:10px"></div>
  <input type="date" id="aufgabe-datum" class="datumfeld voll" hidden>
  <button class="loeschknopf" id="aufgabe-loeschen">Aufgabe löschen</button>
</div>

<script type="module" src="phone.js"></script>
</body>
</html>
