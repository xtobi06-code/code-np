<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alltag">
<title>Alltag</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header { padding: 14px 16px 8px; }
  #datum { font-size: 13px; color: var(--muted); }
  #wetter { display: inline-block; margin-top: 6px; font-size: 13px; padding: 3px 10px; }
  main { flex: 1; padding: 8px 16px 16px; }
  main h1 { font-size: 28px; margin: 8px 0 12px; }
  .leer { color: var(--muted); }
  nav { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--card); border-top: 0.5px solid var(--line); padding: 6px 0 4px; text-align: center; font-size: 11px; }
  nav a { color: var(--muted); padding: 4px 0; }
  nav a.aktiv { color: var(--accent); }
  .status { padding: 0 16px 8px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
</style>
</head>
<body>
<header>
  <div id="datum">…</div>
  <span id="wetter" class="chip">Wetter lädt …</span>
</header>
<main>
  <h1>To-dos</h1>
  <div class="card"><p class="leer" style="margin:0">Hier erscheinen in Phase 2 die Listen Studium und Leben. Finanzen und Einkauf folgen danach.</p></div>
</main>
<div class="status"><span id="sync">…</span><a href="einstellungen.html">Einstellungen</a></div>
<nav>
  <a href="#">Finanzen</a><a href="#">Einkauf</a><a href="#" class="aktiv">To-dos</a>
</nav>
<script type="module">
  import { startHeader } from './shared/util.js';
  import { aktualisiereWetter, pruefeSync, starteZyklus } from './shared/app.js';
  startHeader(document.getElementById('datum'));
  const wetter = () => aktualisiereWetter(document.getElementById('wetter'));
  const sync = () => pruefeSync(document.getElementById('sync'));
  wetter(); sync();
  starteZyklus(wetter, 900);
  starteZyklus(sync, 60);
</script>
</body>
</html>
